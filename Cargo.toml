[package]
name = "aethrcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "AethrCraft: clean-room media offload, culling & metadata engine"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
tokio = { version = "1.40", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"
blake3 = "1.5"
memmap2 = "0.9"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
