[package]
name = "aethrcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "AethrCraft: clean-room media offload, culling & metadata engine"
license = "MIT OR Apache-2.0"

[lib]
name = "aethrcraft"
path = "src/lib.rs"

[[bin]]
name = "aethrcraft"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
tokio = { version = "1.40", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake3 = "1.5"
memmap2 = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.10"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
